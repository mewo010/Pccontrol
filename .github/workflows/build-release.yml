name: Build & Release Cross-Platform Suite

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust-host:
    name: Build Windows Host (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host_pc
        continue-on-error: true

      - name: Build Windows Host Executable
        working-directory: host_pc
        run: cargo build --release

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-binary
          path: host_pc/target/release/remote_pc_host.exe
          if-no-files-found: error

  build-flutter-client:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Complete Android Project with Modern V2 Embedding
        working-directory: client_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.remotepc
          
          # Inject INTERNET and multicast permissions into generated AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>' "$MANIFEST"
            echo "Successfully updated $MANIFEST with network permissions:"
            head -n 20 "$MANIFEST"
          fi
          flutter pub get

      - name: Build Android Release APK
        working-directory: client_mobile
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-client-apk
          path: client_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  create-github-release:
    name: Publish Unified GitHub Release
    needs: [build-rust-host, build-flutter-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version & Generate Changelog
        id: release_meta
        run: |
          VERSION="v1.3.${{ github.run_number }}"
          TITLE="Remote PC Suite $VERSION"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Resolved Tag: $VERSION, Title: $TITLE"

          echo "Generating commit changelog..."
          RECENT_COMMITS=$(git log -n 12 --no-merges --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || echo "* Routine performance and stability improvements")

          cat << EOF > release_body.md
          ## 📦 Remote PC Suite $VERSION

          ### 🔄 What Changed in this Version
          $RECENT_COMMITS

          ---

          ### 🌟 Key Enhancements & Highlights

          #### 🖥️ Windows Host Server (\`RemotePC-Host-Windows.exe\`)
          - **Windows GDI Desktop Capture (\`CAPTUREBLT\` + \`GdiFlush\`)**: Completely resolves blank/black desktop streaming with Desktop Window Manager (DWM) and hardware-accelerated apps (Chrome, Discord, Edge, games).
          - **Multi-Engine Desktop Fallback**: GDI Direct DIBSection ➔ GDI Compatible Bitmap ➔ XCap DXGI Desktop Duplication ➔ Animated Diagnostic Test Pattern.
          - **Outside Wi-Fi WAN Access**: Automatically detects public WAN IP and configures router port 8765 TCP via UPnP.
          - **Sleeping Display Wakeup**: Detects sleeping PC monitors or locked displays, waking them up upon mobile request.
          - **Admin Security Portal**: Protected with password \`Sagiv_2311\`, with persistent device locking across app restarts.

          #### 📱 Android Client App (\`RemotePC-Client-Android.apk\`)
          - **Seamless Outside-of-WiFi Reconnection**: Connect once on Home Wi-Fi; if you step outside or turn off Wi-Fi, the app automatically fails over to Mobile Data (4G/5G) and stays connected!
          - **"Why Can't I See The Screen?" Live Diagnostics**: Root-cause diagnostic center with 4-point health check (Network Link, PC Capture Engine, Frame Delivery, Win32 errors) and 1-tap repair buttons.
          - **Full Touchpad & Controls**: Laptop-style touchpad with glide sensitivity, left/right click, scroll strip, shortcuts, and app launcher.
          - **Admin Management Portal**: Real-time connected client inspector, remote disconnection, and device lock management.

          ---

          ### 📥 Download Prebuilt Binaries
          - **Windows PC**: Download **\`RemotePC-Host-Windows.exe\`** (double-click to run, auto-elevates UAC).
          - **Android Phone**: Download **\`RemotePC-Client-Android.apk\`** (tap to install on phone/tablet).
          EOF

      - name: Create Artifacts Staging Directory
        run: mkdir -p release_assets

      - name: Download Windows Host Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-host-binary
          path: download_host

      - name: Download Android Client Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-client-apk
          path: download_client

      - name: Stage & Verify Release Assets
        run: |
          find download_host -type f -name "*.exe" -exec cp {} release_assets/RemotePC-Host-Windows.exe \;
          find download_client -type f -name "*.apk" -exec cp {} release_assets/RemotePC-Client-Android.apk \;
          echo "Staged release assets:"
          ls -lah release_assets/

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.title }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_assets/RemotePC-Host-Windows.exe
            release_assets/RemotePC-Client-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
