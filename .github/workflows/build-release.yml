name: Build & Release Cross-Platform Suite

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust-host:
    name: Build Windows Host (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host_pc
        continue-on-error: true

      - name: Build Windows Host Executable
        working-directory: host_pc
        run: cargo build --release

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-binary
          path: host_pc/target/release/remote_pc_host.exe
          if-no-files-found: error

  build-flutter-client:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Complete Android Project with Modern V2 Embedding
        working-directory: client_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.remotepc
          
          # Inject INTERNET and multicast permissions into generated AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>' "$MANIFEST"
            echo "Successfully updated $MANIFEST with network permissions:"
            head -n 20 "$MANIFEST"
          fi
          flutter pub get

      - name: Build Android Release APK
        working-directory: client_mobile
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-client-apk
          path: client_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  create-github-release:
    name: Publish Unified GitHub Release
    needs: [build-rust-host, build-flutter-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag & Version
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="Remote PC Suite $TAG"
          else
            TAG="v1.2.0-b${{ github.run_number }}"
            TITLE="Remote PC Suite v1.2.0 (Build #${{ github.run_number }})"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Resolved Tag: $TAG, Title: $TITLE"

      - name: Create Artifacts Staging Directory
        run: mkdir -p release_assets

      - name: Download Windows Host Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-host-binary
          path: download_host

      - name: Download Android Client Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-client-apk
          path: download_client

      - name: Stage & Verify Release Assets
        run: |
          find download_host -type f -name "*.exe" -exec cp {} release_assets/RemotePC-Host-Windows.exe \;
          find download_client -type f -name "*.apk" -exec cp {} release_assets/RemotePC-Client-Android.apk \;
          echo "Staged release assets:"
          ls -lah release_assets/

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.title }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 What's New in this Release

            ### 🖥️ Windows Host Server (`RemotePC-Host-Windows.exe`)
            - **Windows GDI Desktop Capture (`CAPTUREBLT` + `GdiFlush`)**: Completely resolved blank/black desktop streaming with Desktop Window Manager (DWM) and hardware-accelerated windows (Chrome, games, Discord).
            - **Multi-Engine Desktop Fallback**: GDI Direct Section ➔ GDI Compatible Bitmap ➔ XCap DXGI Hardware Duplication.
            - **Black Screen Auto-Detection & Wakeup**: Automatically detects sleeping PC monitors or locked displays, reporting real-time status to the mobile client.
            - **Outside Wi-Fi WAN Support**: Auto-detects public WAN IP and configures router port 8765 TCP via UPnP.
            - **Admin Security Portal**: Protected with `Sagiv_2311` password, supporting remote device locking.

            ### 📱 Android Client App (`RemotePC-Client-Android.apk`)
            - **Seamless Outside-of-WiFi Auto-Reconnect**: If you connect on Home Wi-Fi and leave home, the app automatically switches to your Mobile Data / 4G link and keeps you connected!
            - **Live Screen Diagnostics ("Why Can't I See The Screen?")**: Direct root-cause checklist showing network latency, capture engine, packet delivery, and Windows host errors with 1-tap repair buttons.
            - **Full Touchpad & Controls**: Laptop touchpad with glide sensitivity, left/right click, scroll strip, drag lock, shortcuts, and app launcher.
            - **Admin Management Portal**: View connected devices, apply temporary/indefinite locks, and disconnect users.

            ### 📥 Download Assets Below
            - **Windows PC**: Download `RemotePC-Host-Windows.exe` and double-click to run (auto-elevates and configures firewall).
            - **Android Phone**: Download `RemotePC-Client-Android.apk` and tap to install.
          files: |
            release_assets/RemotePC-Host-Windows.exe
            release_assets/RemotePC-Client-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
